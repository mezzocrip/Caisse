<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caisse Enregistreuse</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .caisse-container {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-top: 0;
      font-size: 24px;
    }
    .ecran {
      background-color: #1a202c;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }
    .total-label {
      color: #a0aec0;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .total-montant {
      color: #38ef7d;
      font-size: 48px;
      font-family: monospace;
      font-weight: bold;
      margin-top: 5px;
    }
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }
    .btn-article {
      background: #edf2f7;
      border: 2px solid #cbd5e0;
      border-radius: 12px;
      padding: 15px 10px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.1s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .btn-article:active {
      transform: scale(0.95);
      background-color: #e2e8f0;
    }
    .emoji {
      font-size: 32px;
    }
    .btn-validation {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: white;
      border: none;
      border-radius: 15px;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(56, 239, 125, 0.4);
      transition: all 0.2s;
    }
    .btn-validation:active {
      transform: scale(0.98);
    }
    .btn-reset {
      margin-top: 15px;
      background: none;
      border: none;
      color: #e53e3e;
      font-weight: bold;
      cursor: pointer;
      padding: 10px;
    }
    /* Notification Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: white;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      transform: scale(0.8);
      transition: transform 0.3s;
      width: 80%;
      max-width: 300px;
    }
    .modal-overlay.active .modal-content {
      transform: scale(1);
    }
    .check-icon {
      font-size: 60px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="caisse-container">
    <h1>Caisse Enregistreuse 🛒</h1>
    
    <div class="ecran">
      <div class="total-label">Total à payer</div>
      <div class="total-montant" id="totalDisplay">0 €</div>
    </div>

    <div class="articles-grid">
      <button class="btn-article" onclick="ajouterArticle(2)">
        <span class="emoji">🍎</span>
        <span>Pomme (2€)</span>
      </button>
      <button class="btn-article" onclick="ajouterArticle(1)">
        <span class="emoji">🥖</span>
        <span>Pain (1€)</span>
      </button>
      <button class="btn-article" onclick="ajouterArticle(3)">
        <span class="emoji">🧃</span>
        <span>Jus (3€)</span>
      </button>
      <button class="btn-article" onclick="ajouterArticle(4)">
        <span class="emoji">🍫</span>
        <span>Chocolat (4€)</span>
      </button>
    </div>

    <button class="btn-validation" onclick="validerPaiement()">
      ✅ Validation paiement
    </button>

    <button class="btn-reset" onclick="reinitialiser()">Annuler / Remise à zéro</button>
  </div>

  <div class="modal-overlay" id="modalSucces">
    <div class="modal-content">
      <div class="check-icon">🎉</div>
      <h2 style="color: #2b6cb0; margin: 0 0 10px 0;">Paiement Accepté !</h2>
      <p id="messagePaiement" style="color: #4a5568; font-size: 18px; font-weight: bold;"></p>
    </div>
  </div>

  <script>
    let total = 0;

    function ajouterArticle(prix) {
      total += prix;
      mettreAJourAffichage();
    }

    function reinitialiser() {
      total = 0;
      mettreAJourAffichage();
    }

    function mettreAJourAffichage() {
      document.getElementById('totalDisplay').textContent = total + ' €';
    }

    function validerPaiement() {
      if (total === 0) {
        alert("Ajoutez des articles dans la caisse avant de valider !");
        return;
      }

      // Vibration du téléphone
      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 100]);
      }

      // Affichage de la notification "Paiement accepté"
      const modal = document.getElementById('modalSucces');
      document.getElementById('messagePaiement').textContent = `Montant réglé : ${total} €`;
      modal.classList.add('active');

      // Masquer la notification et remettre la caisse à zéro après 2.5 secondes
      setTimeout(() => {
        modal.classList.remove('active');
        reinitialiser();
      }, 2500);
    }
  </script>
</body>
</html>
