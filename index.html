<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Caisse Enregistreuse</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Caisse">
  <link rel="apple-touch-icon" href="https://fav.farm/🛒">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      touch-action: manipulation;
    }
    .caisse-container {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-top: 0;
      font-size: 22px;
      margin-bottom: 15px;
    }
    .ecran {
      background-color: #1a202c;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .total-label {
      color: #a0aec0;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .total-montant {
      color: #38ef7d;
      font-size: 38px;
      font-family: monospace;
      font-weight: bold;
      margin-top: 2px;
    }

    /* Ticket / Fenêtre de détail des prix */
    .ticket-container {
      background: #f8fafc;
      border: 2px dashed #cbd5e0;
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 12px;
      max-height: 110px;
      overflow-y: auto;
      text-align: left;
    }
    .ticket-vide {
      color: #a0aec0;
      font-size: 13px;
      text-align: center;
      margin: 8px 0;
      font-style: italic;
    }
    .ligne-ticket {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #2d3748;
      padding: 3px 0;
      border-bottom: 1px solid #edf2f7;
    }
    .ligne-ticket:last-child {
      border-bottom: none;
    }
    .btn-suppr-ligne {
      background: #fed7d7;
      color: #9b2c2c;
      border: none;
      border-radius: 5px;
      font-size: 11px;
      padding: 2px 6px;
      cursor: pointer;
      margin-left: 8px;
    }

    .section-title {
      font-size: 12px;
      color: #718096;
      margin-bottom: 6px;
      text-align: left;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Zone scrollable pour les articles */
    .articles-scroll {
      max-height: 180px;
      overflow-y: auto;
      padding-right: 2px;
      margin-bottom: 15px;
    }
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .btn-article {
      background: #edf2f7;
      border: 1px solid #cbd5e0;
      border-radius: 10px;
      padding: 8px 4px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      touch-action: manipulation;
    }
    .btn-article:active {
      background-color: #cbd5e0;
    }
    .emoji {
      font-size: 20px;
    }
    .prix-tag {
      font-weight: bold;
      color: #2b6cb0;
    }

    /* Pavé numérique */
    .pave-numerique {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 15px;
    }
    .btn-num {
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #2d3748;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-num:active {
      background-color: #edf2f7;
    }
    .btn-num.action {
      background: #feebc8;
      border-color: #fbd38d;
      color: #c05621;
    }
    .btn-num.plus {
      background: #ebf8ff;
      border-color: #90cdf4;
      color: #2b6cb0;
      font-size: 20px;
    }

    .btn-validation {
      background: #38ef7d;
      color: #0d5128;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(56, 239, 125, 0.4);
      touch-action: manipulation;
    }
    .btn-validation:active {
      opacity: 0.8;
    }
    .btn-reset {
      margin-top: 8px;
      background: none;
      border: none;
      color: #e53e3e;
      font-weight: bold;
      cursor: pointer;
      padding: 6px;
      font-size: 13px;
      touch-action: manipulation;
    }

    /* Notification Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: white;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      width: 80%;
      max-width: 280px;
    }
    .check-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="caisse-container">
    <h1>Caisse Enregistreuse 🛒</h1>
    
    <div class="ecran">
      <div class="total-label">Total à payer</div>
      <div class="total-montant" id="totalDisplay">0,00 €</div>
    </div>

    <div class="section-title">Détail du panier</div>
    <div class="ticket-container" id="ticketList">
      <div class="ticket-vide">Aucun article ajouté</div>
    </div>

    <div class="section-title">Articles du quotidien</div>
    <div class="articles-scroll">
      <div class="articles-grid">
        <button class="btn-article" onclick="ajouterArticle('🥖 Baguette', 1.10)">
          <span class="emoji">🥖</span>
          <span>Baguette</span>
          <span class="prix-tag">1,10 €</span>
        </button>
        <button class="btn-article" onclick="ajouterArticle('🥛 Lait (1L)', 1.25)">
          <span class="emoji">🥛</span>
          <span>Lait 1L</span>
          <span class="prix-tag">1,25 €</span>
        </button>
        <button class="btn-article" onclick="ajouterArticle('🥚 6 Œufs', 2.10)">
          <span class="emoji">🥚</span>
          <span>6 Œufs</span>
          <span class="prix-tag">2,10 €</span>
        </button>
        <button class="btn-article" onclick="ajouterArticle('🧀 Fromage', 2.80)">
          <span class="emoji">🧀</span>
          <span>Fromage</span>
          <span class="prix-tag">2,80 €</span>
        </button>
        <button class="btn-article" onclick="ajouterArticle('🍎 Pommes 1kg', 2.50)">
          <span class="emoji">🍎</span>
          <span>Pommes</span>
          <span class="prix-tag">2,50 €</span>
        </button>
        <button class="btn-article" onclick="ajouterArticle('🍝 Pâtes 500g', 1.15)">
          <span class="emoji">🍝</span>
          <span>Pâtes</span>
          <span class="prix-tag">1,15 €</span>
        </button>
        <button class="btn-article" onclick="ajouterArticle('🧃 Jus d’orange', 1.95)">
          <span class="emoji">🧃</span>
          <span>Jus Orange</span>
          <span class="prix-tag">1,95 €</span>
        </button>
        <button class="btn-article" onclick="ajouterArticle('🍫 Chocolat', 1.60)">
          <span class="emoji">🍫</span>
          <span>Chocolat</span>
          <span class="prix-tag">1,60 €</span>
        </button>
        <button class="btn-article" onclick="ajouterArticle('🍪 Paquet Biscuits', 1.85)">
          <span class="emoji">🍪</span>
          <span>Biscuits</span>
          <span class="prix-tag">1,85 €</span>
        </button>
        <button class="btn-article" onclick="ajouterArticle('🧻 Papier Toilette', 3.20)">
          <span class="emoji">🧻</span>
          <span>P. Toilette</span>
          <span class="prix-tag">3,20 €</span>
        </button>
        <button class="btn-article" onclick="ajouterArticle('🧼 Savon mains', 1.40)">
          <span class="emoji">🧼</span>
          <span>Savon</span>
          <span class="prix-tag">1,40 €</span>
        </button>
        <button class="btn-article" onclick="ajouterArticle('🪥 Dentifrice', 2.30)">
          <span class="emoji">🪥</span>
          <span>Dentifrice</span>
          <span class="prix-tag">2,30 €</span>
        </button>
      </div>
    </div>

    <div class="section-title">Saisie libre</div>
    <div class="pave-numerique">
      <button class="btn-num" onclick="taperChiffre('1')">1</button>
      <button class="btn-num" onclick="taperChiffre('2')">2</button>
      <button class="btn-num" onclick="taperChiffre('3')">3</button>
      
      <button class="btn-num" onclick="taperChiffre('4')">4</button>
      <button class="btn-num" onclick="taperChiffre('5')">5</button>
      <button class="btn-num" onclick="taperChiffre('6')">6</button>
      
      <button class="btn-num" onclick="taperChiffre('7')">7</button>
      <button class="btn-num" onclick="taperChiffre('8')">8</button>
      <button class="btn-num" onclick="taperChiffre('9')">9</button>
      
      <button class="btn-num action" onclick="taperChiffre('.')">.</button>
      <button class="btn-num" onclick="taperChiffre('0')">0</button>
      <button class="btn-num plus" onclick="ajouterSaisieManuelle()">+</button>
    </div>

    <button class="btn-validation" onclick="validerPaiement()">
      ✅ Validation paiement
    </button>

    <button class="btn-reset" onclick="reinitialiser()">Remise à zéro</button>
  </div>

  <div class="modal-overlay" id="modalSucces">
    <div class="modal-content">
      <div class="check-icon">🎉</div>
      <h2 style="color: #2b6cb0; margin: 0 0 10px 0;">Paiement Accepté !</h2>
      <p id="messagePaiement" style="color: #4a5568; font-size: 18px; font-weight: bold;"></p>
    </div>
  </div>

  <script>
    // Blocage strict du double-tap zoom sur iOS
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, false);

    let listeArticles = [];
    let saisieEnCours = "0";

    function MettreAJourEcran() {
      let totalArticles = listeArticles.reduce((acc, item) => acc + item.prix, 0);
      let valeurTapee = parseFloat(saisieEnCours) || 0;
      let totalGeneral = Math.round((totalArticles + valeurTapee) * 100) / 100;

      document.getElementById('totalDisplay').innerText = totalGeneral.toFixed(2).replace('.', ',') + ' €';

      const ticketContainer = document.getElementById('ticketList');
      if (listeArticles.length === 0) {
        ticketContainer.innerHTML = '<div class="ticket-vide">Aucun article ajouté</div>';
      } else {
        ticketContainer.innerHTML = '';
        listeArticles.forEach((item, index) => {
          const div = document.createElement('div');
          div.className = 'ligne-ticket';
          div.innerHTML = `
            <span>${item.nom}</span>
            <span>
              <strong>${item.prix.toFixed(2).replace('.', ',')} €</strong>
              <button class="btn-suppr-ligne" onclick="supprimerArticle(${index})">✕</button>
            </span>
          `;
          ticketContainer.appendChild(div);
        });
        ticketContainer.scrollTop = ticketContainer.scrollHeight;
      }
    }

    function ajouterArticle(nom, prix) {
      validerEtAjouterSaisieAUPanier();
      listeArticles.push({ nom: nom, prix: prix });
      MettreAJourEcran();
    }

    function taperChiffre(chiffre) {
      if (chiffre === '.' && saisieEnCours.includes('.')) return;

      if (saisieEnCours === "0" && chiffre !== '.') {
        saisieEnCours = chiffre;
      } else {
        saisieEnCours += chiffre;
      }
      MettreAJourEcran();
    }

    function validerEtAjouterSaisieAUPanier() {
      let prixSaisi = parseFloat(saisieEnCours);
      if (prixSaisi && prixSaisi > 0) {
        listeArticles.push({ nom: 'Article divers', prix: prixSaisi });
        saisieEnCours = "0";
      }
    }

    function ajouterSaisieManuelle() {
      validerEtAjouterSaisieAUPanier();
      MettreAJourEcran();
    }

    function supprimerArticle(index) {
      listeArticles.splice(index, 1);
      MettreAJourEcran();
    }

    function reinitialiser() {
      listeArticles = [];
      saisieEnCours = "0";
      MettreAJourEcran();
    }

    function validerPaiement() {
      validerEtAjouterSaisieAUPanier();
      let totalFinal = listeArticles.reduce((acc, item) => acc + item.prix, 0);
      totalFinal = Math.round(totalFinal * 100) / 100;

      if (!totalFinal || totalFinal === 0) {
        alert("Ajoutez au moins un article ou un prix avant de valider !");
        return;
      }

      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 100]);
      }

      const modal = document.getElementById('modalSucces');
      document.getElementById('messagePaiement').innerText = `Montant réglé : ${totalFinal.toFixed(2).replace('.', ',')} €`;
      modal.classList.add('active');

      setTimeout(() => {
        modal.classList.remove('active');
        reinitialiser();
      }, 2200);
    }
  </script>
</body>
</html>
