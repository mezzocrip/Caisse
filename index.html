<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caisse Enregistreuse</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .caisse-container {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-top: 0;
      font-size: 22px;
      margin-bottom: 15px;
    }
    .ecran {
      background-color: #1a202c;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 10px;
    }
    .total-label {
      color: #a0aec0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .total-montant {
      color: #38ef7d;
      font-size: 40px;
      font-family: monospace;
      font-weight: bold;
      margin-top: 5px;
    }

    /* Ticket / Fenêtre de détail des prix */
    .ticket-container {
      background: #f8fafc;
      border: 2px dashed #cbd5e0;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 15px;
      max-height: 120px;
      overflow-y: auto;
      text-align: left;
    }
    .ticket-vide {
      color: #a0aec0;
      font-size: 13px;
      text-align: center;
      margin: 10px 0;
      font-style: italic;
    }
    .ligne-ticket {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #2d3748;
      padding: 4px 0;
      border-bottom: 1px solid #edf2f7;
    }
    .ligne-ticket:last-child {
      border-bottom: none;
    }
    .btn-suppr-ligne {
      background: #fed7d7;
      color: #9b2c2c;
      border: none;
      border-radius: 5px;
      font-size: 11px;
      padding: 2px 6px;
      cursor: pointer;
      margin-left: 8px;
    }

    .section-title {
      font-size: 13px;
      color: #718096;
      margin-bottom: 8px;
      text-align: left;
      font-weight: bold;
    }
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }
    .btn-article {
      background: #edf2f7;
      border: 2px solid #cbd5e0;
      border-radius: 10px;
      padding: 10px 2px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .btn-article:active {
      background-color: #cbd5e0;
    }
    .emoji {
      font-size: 22px;
    }
    /* Pavé numérique */
    .pave-numerique {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }
    .btn-num {
      background: #fff;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      font-size: 20px;
      font-weight: bold;
      color: #2d3748;
      cursor: pointer;
    }
    .btn-num:active {
      background-color: #edf2f7;
    }
    .btn-num.action {
      background: #feebc8;
      border-color: #fbd38d;
      color: #c05621;
    }
    .btn-num.plus {
      background: #ebf8ff;
      border-color: #90cdf4;
      color: #2b6cb0;
      font-size: 24px;
    }
    .btn-validation {
      background: #38ef7d;
      color: #0d5128;
      border: none;
      border-radius: 15px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(56, 239, 125, 0.4);
    }
    .btn-validation:active {
      opacity: 0.8;
    }
    .btn-reset {
      margin-top: 10px;
      background: none;
      border: none;
      color: #e53e3e;
      font-weight: bold;
      cursor: pointer;
      padding: 8px;
    }
    /* Notification Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: white;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      width: 80%;
      max-width: 280px;
    }
    .check-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="caisse-container">
    <h1>Caisse Enregistreuse 🛒</h1>
    
    <div class="ecran">
      <div class="total-label">Total à payer</div>
      <div class="total-montant" id="totalDisplay">0 €</div>
    </div>

    <div class="section-title">Détail du panier</div>
    <div class="ticket-container" id="ticketList">
      <div class="ticket-vide">Aucun article ajouté</div>
    </div>

    <div class="section-title">Articles rapides</div>
    <div class="articles-grid">
      <button class="btn-article" onclick="ajouterArticle('🍎 Pomme', 2)">
        <span class="emoji">🍎</span>
        <span>+2 €</span>
      </button>
      <button class="btn-article" onclick="ajouterArticle('🥖 Pain', 1)">
        <span class="emoji">🥖</span>
        <span>+1 €</span>
      </button>
      <button class="btn-article" onclick="ajouterArticle('🧃 Jus', 3)">
        <span class="emoji">🧃</span>
        <span>+3 €</span>
      </button>
      <button class="btn-article" onclick="ajouterArticle('🍫 Chocolat', 4)">
        <span class="emoji">🍫</span>
        <span>+4 €</span>
      </button>
    </div>

    <div class="section-title">Saisie libre</div>
    <div class="pave-numerique">
      <button class="btn-num" onclick="taperChiffre('1')">1</button>
      <button class="btn-num" onclick="taperChiffre('2')">2</button>
      <button class="btn-num" onclick="taperChiffre('3')">3</button>
      
      <button class="btn-num" onclick="taperChiffre('4')">4</button>
      <button class="btn-num" onclick="taperChiffre('5')">5</button>
      <button class="btn-num" onclick="taperChiffre('6')">6</button>
      
      <button class="btn-num" onclick="taperChiffre('7')">7</button>
      <button class="btn-num" onclick="taperChiffre('8')">8</button>
      <button class="btn-num" onclick="taperChiffre('9')">9</button>
      
      <button class="btn-num action" onclick="taperChiffre('.')">.</button>
      <button class="btn-num" onclick="taperChiffre('0')">0</button>
      <button class="btn-num plus" onclick="ajouterSaisieManuelle()">+</button>
    </div>

    <button class="btn-validation" onclick="validerPaiement()">
      ✅ Validation paiement
    </button>

    <button class="btn-reset" onclick="reinitialiser()">Remise à zéro</button>
  </div>

  <div class="modal-overlay" id="modalSucces">
    <div class="modal-content">
      <div class="check-icon">🎉</div>
      <h2 style="color: #2b6cb0; margin: 0 0 10px 0;">Paiement Accepté !</h2>
      <p id="messagePaiement" style="color: #4a5568; font-size: 18px; font-weight: bold;"></p>
    </div>
  </div>

  <script>
    let listeArticles = [];
    let saisieEnCours = "0";

    function MettreAJourEcran() {
      // Calcul du total de tous les articles dans la liste
      let totalArticles = listeArticles.reduce((acc, item) => acc + item.prix, 0);
      let valeurTapee = parseFloat(saisieEnCours) || 0;
      let totalGeneral = Math.round((totalArticles + valeurTapee) * 100) / 100;

      document.getElementById('totalDisplay').innerText = totalGeneral + ' €';

      // Mise à jour de la fenêtre de détail
      const ticketContainer = document.getElementById('ticketList');
      if (listeArticles.length === 0) {
        ticketContainer.innerHTML = '<div class="ticket-vide">Aucun article ajouté</div>';
      } else {
        ticketContainer.innerHTML = '';
        listeArticles.forEach((item, index) => {
          const div = document.createElement('div');
          div.className = 'ligne-ticket';
          div.innerHTML = `
            <span>${item.nom}</span>
            <span>
              <strong>${item.prix} €</strong>
              <button class="btn-suppr-ligne" onclick="supprimerArticle(${index})">✕</button>
            </span>
          `;
          ticketContainer.appendChild(div);
        });
        // Faire défiler automatiquement vers le bas du ticket
        ticketContainer.scrollTop = ticketContainer.scrollHeight;
      }
    }

    function ajouterArticle(nom, prix) {
      validerEtAjouterSaisieAUPanier();
      listeArticles.push({ nom: nom, prix: prix });
      MettreAJourEcran();
    }

    function taperChiffre(chiffre) {
      if (chiffre === '.' && saisieEnCours.includes('.')) return;

      if (saisieEnCours === "0" && chiffre !== '.') {
        saisieEnCours = chiffre;
      } else {
        saisieEnCours += chiffre;
      }
      MettreAJourEcran();
    }

    function validerEtAjouterSaisieAUPanier() {
      let prixSaisi = parseFloat(saisieEnCours);
      if (prixSaisi && prixSaisi > 0) {
        listeArticles.push({ nom: 'Article divers', prix: prixSaisi });
        saisieEnCours = "0";
      }
    }

    function ajouterSaisieManuelle() {
      validerEtAjouterSaisieAUPanier();
      MettreAJourEcran();
    }

    function supprimerArticle(index) {
      listeArticles.splice(index, 1);
      MettreAJourEcran();
    }

    function reinitialiser() {
      listeArticles = [];
      saisieEnCours = "0";
      MettreAJourEcran();
    }

    function validerPaiement() {
      validerEtAjouterSaisieAUPanier();
      let totalFinal = listeArticles.reduce((acc, item) => acc + item.prix, 0);
      totalFinal = Math.round(totalFinal * 100) / 100;

      if (!totalFinal || totalFinal === 0) {
        alert("Ajoutez au moins un article ou un prix avant de valider !");
        return;
      }

      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 100]);
      }

      const modal = document.getElementById('modalSucces');
      document.getElementById('messagePaiement').innerText = `Montant réglé : ${totalFinal} €`;
      modal.classList.add('active');

      setTimeout(() => {
        modal.classList.remove('active');
        reinitialiser();
      }, 2200);
    }
  </script>
</body>
</html>
